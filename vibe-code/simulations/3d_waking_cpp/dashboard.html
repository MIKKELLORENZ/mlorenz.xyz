<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>walk3d — training</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2316161a'/%3E%3Cpath d='M4 12V7l4-3 4 3v5' stroke='%233987e5' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root {
    color-scheme: dark;
    --surface-0: #0f0f12;
    --surface-1: #16161a;
    --surface-2: #1d1d22;
    --line:      #2c2c33;
    --axis:      #3a3a42;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-3:     #85848c;
    /* Categorical slots 1-3, dark steps. Validated as a set against
       surface #16161a: all-pairs CVD dE 9.4 worst, normal-vision 20.9, all
       three >= 3:1 contrast. Do not substitute by eye. */
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --good: #0ca30c;
    --warn: #c98500;
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--surface-0); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
}
header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface-1);
    position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
/* Island identity. A left rule on the header plus a chip beside the title —
 * enough to tell two open tabs apart at a glance, without repainting any
 * series, because series colour has to keep meaning the metric it names. */
header.island { border-left: 4px solid var(--isl, var(--s1)); }
.islandtag {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--isl, var(--s1));
    color: var(--isl, var(--s1)); white-space: nowrap;
}
.peerlink { font-size: 12px; color: var(--ink-3); text-decoration: none; border-bottom: 1px dotted var(--line); }
.peerlink:hover { color: var(--ink); }
.sub { color: var(--ink-3); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(12,163,12,.18); }
.dot.off { background: var(--s2); box-shadow: 0 0 0 3px rgba(217,89,38,.18); }
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-size: 26px; font-weight: 620; margin-top: 4px; line-height: 1.15; }
.tile .u { font-size: 13px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.tile .n { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 8px; min-width: 0; }
.card h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
.card .why { color: var(--ink-3); font-size: 11.5px; margin: 0 0 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 6px; font-size: 12px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; overflow-x: auto; }
svg { display: block; width: 100%; height: auto; }
.tt {
    position: fixed; pointer-events: none; z-index: 20; opacity: 0; transition: opacity .1s;
    background: var(--surface-2); border: 1px solid var(--axis); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 280px;
}
.tt b { font-weight: 600; }
.tt .row { display: flex; justify-content: space-between; gap: 14px; }
.tt .row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.events { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
.events ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column-reverse; }
.events li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); display: flex; gap: 10px; }
.events li:last-child { border-bottom: 0; }
.tag { flex: 0 0 auto; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink-3); height: fit-content; }
.tag.adopt { color: var(--good); border-color: rgba(12,163,12,.45); }
.tag.plateau { color: var(--warn); border-color: rgba(201,133,0,.45); }
.tag.stage { color: var(--s1); border-color: rgba(57,135,229,.45); }
.tag.actcull { color: var(--good); border-color: rgba(12,163,12,.45); }
.tag.milestone { color: var(--good); border-color: rgba(12,163,12,.45); font-weight: 600; }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 8px; }
.trk { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.trk .n { font-size: 12px; color: var(--ink-2); }
.trk .f { font-size: 18px; font-weight: 600; }
.bar { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--s1); }
button.tbl { background: transparent; border: 1px solid var(--axis); color: var(--ink-2); border-radius: 6px; font: inherit; font-size: 11.5px; padding: 2px 9px; cursor: pointer; }
button.tbl:hover { border-color: var(--ink-3); }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-3); font-weight: 500; }
.hide { display: none; }
</style>
</head>
<body>
<header id="hdr">
    <h1><span id="live-dot" class="dot off"></span>walk3d — 3D humanoid neuroevolution</h1>
    <span class="islandtag" id="hdr-island" hidden></span>
    <a class="peerlink" id="hdr-peer" hidden></a>
    <span class="sub" id="hdr-gen">connecting…</span>
    <span class="sub" id="hdr-deadline"></span>
    <span class="sub" id="hdr-run"></span>
    <span class="sub" id="hdr-updated" style="margin-left:auto"></span>
</header>
<main>
    <section class="tiles" id="tiles"></section>
    <section id="round-card"></section>
    <section class="grid" id="charts"></section>
    <section class="events">
        <h2 style="font-size:13px;margin:0 0 8px;font-weight:600">Run events</h2>
        <ol id="events"></ol>
    </section>
</main>
<div class="tt" id="tt"></div>

<script>
const $ = id => document.getElementById(id);
const S = { s1: "#3987e5", s2: "#d95926", s3: "#199e70" };
/* Fixed hue per activation, assigned by name and never by rank — a lineage that
 * overtakes another must not swap colours underneath the reader. */
const ACT_COLOR = { tanh: S.s1, lrelu: S.s2, relu: S.s3 };
let DATA = null;

const fmt = (v, d = 0) => v == null || !isFinite(v) ? "–" : (+v).toFixed(d);
const nice = v => v == null || !isFinite(v) ? "–" : Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k" : (+v).toFixed(0);

/* ---------------------------------------------------------------- charts
 * One line-chart routine, hand-rolled SVG. Deliberately not a dual-axis
 * anything: where two measures have different units (waypoints and metres)
 * they get two charts, because a second y-scale invites reading a crossing
 * point as meaningful when it is an artefact of the scaling. */
/* ------------------------------------------------------------- animation
 * The chart used to be rebuilt with innerHTML on every poll, so it SNAPPED: the
 * line jumped, the axis jumped, and any tooltip you were reading was destroyed
 * under the cursor. At a 15-second poll that was tolerable; at five seconds it
 * would be strobing.
 *
 * So the SVG is now built ONCE and its geometry is animated. Two things move,
 * and they are the two things that actually change:
 *   · the axis bounds, when a new point pushes the scale out
 *   · the line's leading edge, which grows into the new point rather than
 *     appearing at it
 * Historical points never change value, so nothing else needs to move.
 *
 * Cached node references are updated directly instead of re-serialising markup,
 * which keeps the hit rectangle and its listeners alive — the tooltip survives an
 * update now, which is the whole reason for doing it this way rather than
 * cross-fading two rendered images. */
const EASE = t => 1 - Math.pow(1 - t, 3);       // easeOutCubic: quick, then settles
const ANIM_MS = 550;

function lineChart(el, cfg) {
    const W = 560, H = cfg.height || 190, P = { t: 10, r: 14, b: 24, l: 46 };
    const all = cfg.series.flatMap(s => s.pts);
    if (!all.length) { el.innerHTML = '<p class="why">no data yet</p>'; el._st = null; return; }
    const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    let x0 = Math.min(...xs), x1 = Math.max(...xs);
    const fixed0 = cfg.y0 != null, fixed1 = cfg.y1 != null;
    let y0 = fixed0 ? cfg.y0 : Math.min(...ys), y1 = fixed1 ? cfg.y1 : Math.max(...ys);
    if (x1 === x0) x1 = x0 + 1;
    if (y1 === y0) y1 = y0 + 1;
    // Headroom only where the bound was inferred. Padding an explicit one put a
    // "108%" tick on a chart of percentages.
    const pad = (y1 - y0) * 0.08;
    if (!fixed1) y1 += pad;
    if (!fixed0) y0 -= pad;
    /* Tick decimals from the SPAN, not from the magnitude. Waypoints run 0 to
     * 0.6, and a whole-number formatter labelled every gridline on that chart
     * "0" — four identical ticks and no readable scale. */
    const span = y1 - y0;
    const autoFmt = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k"
        : span < 3 ? v.toFixed(2) : span < 25 ? v.toFixed(1) : v.toFixed(0);
    const target = { x0, x1, y0, y1 };

    /* Nothing to do when nothing moved. At a five-second poll most requests land
     * between generations, and re-running the animation on identical data would
     * make a still chart shimmer for no reason. */
    const sig = cfg.series.map(s => s.name + ":" + s.pts.length).join("|")
              + "|" + [x0, x1, y0, y1].map(v => v.toFixed(4)).join(",")
              + "|" + (cfg.markers || []).map(m => m.x).join(",")
              + "|" + (cfg.bands || []).map(b => b.from + "-" + b.to).join(",");

    let st = el._st;
    const shapeChanged = !st || st.H !== H || st.nSeries !== cfg.series.length;
    if (!shapeChanged && st.sig === sig) { st.cfg = cfg; return; }

    if (shapeChanged) {
        // Build the skeleton once. Everything below only moves what is already here.
        el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${cfg.aria || ""}">
            <g class="bands"></g><g class="grid"></g><g class="marks"></g>
            <line class="axis" x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--axis)"/>
            <g class="plot">${cfg.series.map(s => s.dots
                ? `<g class="dots" fill="${s.color}"></g>`
                : `<path fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                   <circle r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`).join("")}</g>
            <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/>
            <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>
        </svg>`;
        const svgEl = el.querySelector("svg");
        st = el._st = {
            H, nSeries: cfg.series.length, cfg,
            svg: svgEl,
            bands: svgEl.querySelector(".bands"), grid: svgEl.querySelector(".grid"),
            marks: svgEl.querySelector(".marks"), plot: svgEl.querySelector(".plot"),
            hit: svgEl.querySelector(".hit"), cross: svgEl.querySelector(".cross"),
            view: null, prevPts: null, raf: 0
        };
        // Crosshair + tooltip, attached ONCE. An SVG chart in a browser is
        // interactive by default; the hover layer is what makes a dense line
        // readable at a single x — and it now survives an update.
        const tt = $("tt");
        st.hit.addEventListener("mousemove", ev => {
            const c = st.cfg, v = st.view || target;
            const r = st.svg.getBoundingClientRect();
            const px = (ev.clientX - r.left) / r.width * W;
            const gx = v.x0 + (px - P.l) / (W - P.l - P.r) * (v.x1 - v.x0);
            st.cross.setAttribute("x1", px); st.cross.setAttribute("x2", px);
            st.cross.setAttribute("opacity", ".5");
            const rows = c.series.map(s => {
                if (!s.pts.length) return null;
                let bp = s.pts[0], bd = Infinity;
                for (const p of s.pts) { const d = Math.abs(p[0] - gx); if (d < bd) { bd = d; bp = p; } }
                return { s, p: bp };
            }).filter(Boolean);
            if (!rows.length) return;
            tt.innerHTML = `<b>generation ${Math.round(rows[0].p[0])}</b>` + rows.map(r =>
                `<div class="row"><span><i style="background:${r.s.color}"></i>${r.s.name}</span><b>${c.tipFmt ? c.tipFmt(r.p[1]) : nice(r.p[1])}</b></div>`).join("");
            tt.style.opacity = 1;
            const tw = tt.offsetWidth, th = tt.offsetHeight;
            tt.style.left = Math.min(window.innerWidth - tw - 8, Math.max(8, ev.clientX + 14)) + "px";
            tt.style.top = Math.max(8, ev.clientY - th - 12) + "px";
        });
        st.hit.addEventListener("mouseleave", () => {
            $("tt").style.opacity = 0; st.cross.setAttribute("opacity", 0);
        });
    }
    st.cfg = cfg;
    st.sig = sig;

    const ticksY = 4, ticksX = 5;
    /* Draw at an interpolated view, with `grow` in 0..1 controlling how much of
     * the newly-arrived tail is revealed. Everything reads from cached nodes. */
    const paint = (v, grow) => {
        const X = t => P.l + (t - v.x0) / (v.x1 - v.x0) * (W - P.l - P.r);
        const Y = t => H - P.b - (t - v.y0) / (v.y1 - v.y0) * (H - P.t - P.b);
        let g = "";
        for (let i = 0; i <= ticksY; i++) {
            const val = v.y0 + (v.y1 - v.y0) * i / ticksY, y = Y(val);
            g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
            g += `<text x="${P.l - 7}" y="${y + 3.5}" fill="var(--ink-3)" font-size="10" text-anchor="end">${cfg.yFmt ? cfg.yFmt(val) : autoFmt(val)}</text>`;
        }
        /* Generations are integers, so a chart spanning only a few of them rounds
         * several ticks to the same number — "120 120 121" reads as a broken axis.
         * Label each value once. */
        const seenX = new Set();
        for (let i = 0; i <= ticksX; i++) {
            const val = v.x0 + (v.x1 - v.x0) * i / ticksX;
            const lbl = Math.round(val);
            if (seenX.has(lbl)) continue;
            seenX.add(lbl);
            g += `<text x="${X(val)}" y="${H - 7}" fill="var(--ink-3)" font-size="10" text-anchor="middle">${lbl}</text>`;
        }
        st.grid.innerHTML = g;

        // Shaded bands (plateau rounds) sit under everything.
        let bands = "";
        for (const b of cfg.bands || []) {
            const bx = X(Math.max(v.x0, b.from)), bw = X(Math.min(v.x1, b.to)) - bx;
            if (bw > 0) bands += `<rect x="${bx}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="rgba(201,133,0,.10)"/>`;
        }
        st.bands.innerHTML = bands;

        let marks = "";
        for (const m of cfg.markers || []) {
            if (m.x < v.x0 || m.x > v.x1) continue;
            const mx = X(m.x);
            marks += `<line x1="${mx}" x2="${mx}" y1="${P.t}" y2="${H - P.b}" stroke="${m.color || "var(--axis)"}" stroke-width="${m.label ? 1.5 : 1}" stroke-dasharray="${m.label ? "4 3" : "3 3"}"/>`;
            /* A labelled marker anchors its text on whichever side has room, so a
             * milestone near the right edge does not print off the plot. Text wears
             * an ink token, not the marker's colour — the dashed line already
             * carries the identity. */
            if (m.label) {
                const right = mx < (W - P.r + P.l) / 2;
                marks += `<text x="${right ? mx + 5 : mx - 5}" y="${P.t + 9}" fill="var(--ink-2)" font-size="9.5" ` +
                         `text-anchor="${right ? "start" : "end"}">${m.label}</text>`;
            }
        }
        st.marks.innerHTML = marks;

        let node = st.plot.firstElementChild;
        cfg.series.forEach((s, si) => {
            if (s.dots) {
                const dg = node; node = node.nextElementSibling;
                dg.innerHTML = s.pts.map(p =>
                    `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" opacity=".55"/>`).join("");
                return;
            }
            const path = node; node = node.nextElementSibling;
            const dot = node; node = node.nextElementSibling;
            if (!s.pts.length) { path.setAttribute("d", ""); dot.setAttribute("r", 0); return; }
            /* Reveal the tail. `from` is how many points were on screen last time,
             * so the line grows into whatever arrived rather than blinking into
             * existence at the new value. */
            const prevN = (st.prevPts && st.prevPts[si] != null) ? Math.min(st.prevPts[si], s.pts.length) : s.pts.length;
            const extra = s.pts.length - prevN;
            const shown = prevN + extra * grow;
            const whole = Math.max(1, Math.min(s.pts.length, Math.floor(shown)));
            let d = "";
            for (let i = 0; i < whole; i++) d += `${i ? "L" : "M"}${X(s.pts[i][0]).toFixed(1)},${Y(s.pts[i][1]).toFixed(1)}`;
            let lx = s.pts[whole - 1][0], ly = s.pts[whole - 1][1];
            if (whole < s.pts.length) {
                const f = shown - whole;
                const a = s.pts[whole - 1], b = s.pts[whole];
                lx = a[0] + (b[0] - a[0]) * f;
                ly = a[1] + (b[1] - a[1]) * f;
                d += `L${X(lx).toFixed(1)},${Y(ly).toFixed(1)}`;
            }
            path.setAttribute("d", d);
            // A 2px surface ring so a marker crossing another line stays legible.
            dot.setAttribute("cx", X(lx).toFixed(1));
            dot.setAttribute("cy", Y(ly).toFixed(1));
            dot.setAttribute("r", 4);
        });
    };

    const from = st.view;
    const prevCounts = st.prevPts;
    st.prevPts = cfg.series.map(s => s.pts.length);
    if (st.raf) cancelAnimationFrame(st.raf);

    // First paint, or a reader who prefers no motion: land on the answer.
    if (!from || matchMedia("(prefers-reduced-motion: reduce)").matches) {
        st.view = target;
        paint(target, 1);
        return;
    }
    st.prevPts = prevCounts;                       // grow FROM the old counts
    const t0 = performance.now();
    const step = now => {
        const t = Math.min(1, (now - t0) / ANIM_MS), e = EASE(t);
        const v = {
            x0: from.x0 + (target.x0 - from.x0) * e, x1: from.x1 + (target.x1 - from.x1) * e,
            y0: from.y0 + (target.y0 - from.y0) * e, y1: from.y1 + (target.y1 - from.y1) * e
        };
        st.view = v;
        paint(v, e);
        if (t < 1) st.raf = requestAnimationFrame(step);
        else { st.raf = 0; st.view = target; st.prevPts = cfg.series.map(s => s.pts.length); }
    };
    st.raf = requestAnimationFrame(step);
}

/* Card ids are STABLE, derived from the title rather than drawn at random.
 * render() reuses the existing chart nodes when the set of cards has not changed,
 * and reuse is what makes the animation possible at all — a random id would
 * replace every SVG on every poll and there would be nothing to animate from. */
const CARD_IDS = new Map();
function idFor(title) {
    if (!CARD_IDS.has(title)) CARD_IDS.set(title, "c" + CARD_IDS.size);
    return CARD_IDS.get(title);
}

function card(title, why, seriesDefs, opts) {
    const legend = seriesDefs.length > 1
        ? `<div class="legend">${seriesDefs.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "";
    const id = idFor(title);
    const tid = id + "t";
    return { html: `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <h2>${title}</h2><button class="tbl" data-for="${tid}">table</button>
        </div>
        <p class="why">${why}</p>${legend}
        <div class="chart" id="${id}"></div>
        <div id="${tid}" class="hide"></div>
      </div>`, id, tid, seriesDefs, opts };
}

function tableFor(seriesDefs, xName) {
    const xs = [...new Set(seriesDefs.flatMap(s => s.pts.map(p => p[0])))].sort((a, b) => a - b).slice(-200);
    const idx = seriesDefs.map(s => new Map(s.pts));
    return `<table><thead><tr><th>${xName}</th>${seriesDefs.map(s => `<th>${s.name}</th>`).join("")}</tr></thead><tbody>`
        + xs.map(x => `<tr><td>${Math.round(x)}</td>${idx.map(m => `<td>${m.has(x) ? (+m.get(x)).toFixed(2) : ""}</td>`).join("")}</tr>`).join("")
        + `</tbody></table>`;
}

/* The incumbent line, extended to the left edge when the bar was set before
 * this run started. Without the carried-over point the line begins wherever the
 * first new best happens to land and the reader cannot see what was already
 * being beaten. */
function heldLine(d, key) {
    const pts = d.heldout.filter(h => h.isBest).map(h => [h.gen, h[key]]);
    if (d.priorBest && d.runStart != null) pts.unshift([d.runStart, d.priorBest[key]]);
    const lastGen = d.live && d.live.gen;
    // Carry it flat to "now" — a ratchet holds until something beats it.
    if (pts.length && lastGen && pts[pts.length - 1][0] < lastGen) pts.push([lastGen, pts[pts.length - 1][1]]);
    return pts;
}

/* Island identity, applied once. window.ISLAND is injected by dashboard.js from
 * its --label/--peer flags, so a page served with neither behaves exactly as
 * before and nothing appears. */
(function islandBadge() {
    const I = window.ISLAND || {};
    if (I.label) {
        const tag = $("hdr-island");
        tag.textContent = I.label;
        tag.hidden = false;
        // Hue by island, from the same validated palette the charts use.
        $("hdr").classList.add("island");
        $("hdr").style.setProperty("--isl", /\bB\b|new|fresh|heading/i.test(I.label)
            ? "var(--s3)" : "var(--s1)");
        document.title = `${I.label} — walk3d`;
    }
    if (I.peer) {
        const a = $("hdr-peer");
        a.href = I.peer;
        a.textContent = `→ ${I.peerLabel || "the other island"}`;
        a.hidden = false;
    }
})();

/* ------------------------------------------------------------------ render */
function render(d) {
    const L = d.live || {};
    $("live-dot").className = "dot " + (d.alive ? "on" : "off");
    $("hdr-gen").textContent = L.gen ? `generation ${L.gen} · stage ${L.stage} · ${fmt(L.secPerGen, 1)} s/gen` : "waiting for the first generation";
    // Say so when the charts start partway along: a reader who knows the run
    // resumed at 117 will not read the left edge as the beginning of learning.
    $("hdr-run").textContent = d.priorGens > 0
        ? `charts from generation ${d.runStart} — this run · ${d.priorGens} earlier generations bred under a different scheme are not drawn`
        : "";
    $("hdr-updated").textContent = d.alive ? "live" : "no output for 5+ min";
    if (d.deadline) {
        const left = d.deadline - d.now;
        $("hdr-deadline").textContent = left > 0
            ? `stops in ${Math.floor(left / 3600000)}h ${Math.floor(left % 3600000 / 60000)}m`
            : "deadline passed";
    }

    const b = d.best || {};
    const heldWp = d.heldout.filter(h => h.isBest);
    $("tiles").innerHTML = [
        ["Held-out waypoints", fmt(b.waypoints, 2), "", `best on 12 unseen missions · gen ${b.gen ?? "–"}`],
        ["Held-out distance", fmt(b.metres, 2), "m", `${b.twoPlus ?? 0}/12 missions reached 2+`],
        ["Fleet best", nice(L.best), "", "this generation, training fitness"],
        // Never name a population size here. It said "all 512" for three runs
        // that were 256 and 288, which is the kind of caption that makes a
        // reader distrust the numbers beside it.
        ["Fleet average", nice(L.avg), "", "whole population, training fitness"],
        ["Standing", fmt(L.stood, 0), "%", `${fmt(L.balanced, 0)}% held balance`],
        ["Rose from floor", fmt(L.rose, 0), "%", `of ${fmt(L.ground, 0)}% that started down`],
        ["Mutation", L.mutRate != null ? fmt(L.mutRate, 3) + "/" + fmt(L.mutSigma, 3) : "0.020/0.030", "",
            L.mutRate != null ? "adopted by a winning track" : "as launched"],
        ["Exams run", String(d.heldout.length), "", `${heldWp.length} raised the bar`],
        // Only while the activations are still being compared…
        ...(L.acts && L.acts.length > 1
            ? [["Activation ahead", L.acts.slice().sort((a, x) => (x.best ?? -1e18) - (a.best ?? -1e18))[0].act, "",
                L.acts.map(a => `${a.act} ${nice(a.best)}`).join(" · ")]]
            : []),
        // …or, when they interbreed, the proportion they have settled at.
        ...(L.leaky != null
            ? [["Leaky units", fmt(L.leaky, 0), "%", `champion ${fmt(L.bestLeaky, 0)}% · started at 50%`]]
            : [])
    ].map(([k, v, u, n]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}<span class="u">${u}</span></div><div class="n">${n}</div></div>`).join("");

    // Live round panel, only while a round is running.
    $("round-card").innerHTML = (L.tracks && L.roundOf)
        ? `<div class="card" style="margin-bottom:16px"><h2>Plateau search — generation ${L.roundGens} of ${L.roundOf}</h2>
           <p class="why">The run stopped improving, so part of the population was split into independent lineages, each seeded from the leader and breeding under different mutation settings. A lineage that overtakes the leader takes the crown and its settings.</p>
           <div class="bar"><i style="width:${(100 * L.roundGens / L.roundOf).toFixed(1)}%"></i></div>
           <div class="tracks">${L.tracks.map(t =>
            `<div class="trk"><div class="n">${t.name}</div><div class="f">${t.best == null ? "–" : nice(t.best)}</div></div>`).join("")}
           <div class="trk" style="border-color:var(--s1)"><div class="n">leader</div><div class="f">${nice(L.best)}</div></div></div></div>`
        : "";

    const s = d.series;
    const bands = [];
    let open = null;
    for (const e of d.events) {
        if (e.kind === "plateau") open = e.gen;
        else if ((e.kind === "adopt" || e.kind === "dissolve") && open != null) { bands.push({ from: open, to: e.gen }); open = null; }
    }
    if (open != null && L.gen) bands.push({ from: open, to: L.gen });
    const stageMarks = d.events.filter(e => e.kind === "stage").map(e => ({ x: e.gen, color: "var(--s1)" }));

    /* Milestones go on EVERY chart, not just the fitness one. A sensor arriving
     * mid-run changes what every curve means — the held-out ones most of all,
     * since that is where it either pays for itself or does not. */
    const milestoneMarks = (d.milestones || []).map(m => ({
        x: m.gen, color: "var(--good)", label: m.label || m.kind
    }));
    const marksFor = extra => milestoneMarks.concat(extra || []);

    /* Which activations this run has actually carried, in the order the run
     * declared them — read from the series rather than hard-coded, so a run
     * launched with --acts tanh,relu draws two lines and not three empty ones. */
    const cullEvent = d.events.filter(e => e.kind === "actcull").pop() || null;
    const demeActs = (() => {
        const seen = [];
        for (const r of s) for (const dm of (r.demes || [])) {
            // "mixed" is not a lineage — it is the label of the single merged
            // pool once the rectifiers began interbreeding. Plotting it as a
            // fourth deme puts the whole population on the isolation chart and
            // reads as an activation that competed against the others.
            if (dm.act !== "mixed" && seen.indexOf(dm.act) < 0) seen.push(dm.act);
        }
        return seen;
    })();
    // Did the run later switch to one interbreeding pool? Changes what the
    // isolation chart is: live experiment, or the record of a finished one.
    const wentMixed = s.some(r => (r.demes || []).some(dm => dm.act === "mixed"));

    const cards = [
        card("Fitness over generations",
            "Training fitness of the best individual and of the whole fleet. Amber bands are plateau searches; dashed lines are stage promotions, after which the numbers are not comparable with what came before.",
            [{ name: "best", color: S.s1, pts: s.map(r => [r.gen, r.best]) },
             { name: "fleet average", color: S.s2, pts: s.map(r => [r.gen, r.avg]) }],
            { bands, markers: marksFor(stageMarks), height: 210 }),
        /* The ratchet survives a relaunch even though the chart does not, so
         * the bar it already set is drawn as a horizontal reference rather than
         * dropped. A run whose dots sit under a flat line it never earned is
         * the honest picture; an empty chart would imply there is nothing to
         * beat. */
        card("Held-out waypoints",
            "Waypoints reached on twelve missions no generation ever trains on. Dots are every candidate examined; the line is the incumbent — the only score this project trusts." +
            (d.priorBest ? ` The bar carried over from generation ${d.priorBest.gen}, before this run.` : ""),
            [{ name: "incumbent", color: S.s3, pts: heldLine(d, "wp") },
             { name: "every candidate", color: S.s2, pts: d.heldout.map(h => [h.gen, h.wp]), dots: true }],
            { y0: 0, markers: milestoneMarks, tipFmt: v => v.toFixed(2) }),
        card("Held-out distance",
            "Metres walked on the same unseen missions. Separate chart, not a second axis on the one above — different units share no scale.",
            [{ name: "incumbent", color: S.s1, pts: heldLine(d, "m") },
             { name: "every candidate", color: S.s2, pts: d.heldout.map(h => [h.gen, h.m]), dots: true }],
            { y0: 0, markers: milestoneMarks, tipFmt: v => v.toFixed(2) + " m" }),
        card("Fleet ability",
            "Share of the population that stood, that held its balance, and that got back up after starting on the floor. All three are percentages, so they share one axis honestly.",
            [{ name: "stood", color: S.s1, pts: s.map(r => [r.gen, r.stood]).filter(p => p[1] != null) },
             { name: "held balance", color: S.s2, pts: s.map(r => [r.gen, r.balanced]).filter(p => p[1] != null) },
             { name: "rose from floor", color: S.s3, pts: s.map(r => [r.gen, r.rose]).filter(p => p[1] != null) }],
            { y0: 0, y1: 100, markers: milestoneMarks, yFmt: v => v.toFixed(0) + "%", tipFmt: v => v.toFixed(0) + "%" }),
        card("Distance walked in training",
            "Metres of honest closure towards the waypoint, averaged over the fleet and for its best walker.",
            [{ name: "fleet average", color: S.s2, pts: s.map(r => [r.gen, r.walked]).filter(p => p[1] != null) },
             { name: "best walker", color: S.s1, pts: s.map(r => [r.gen, r.bestWalked]).filter(p => p[1] != null) }],
            { y0: 0, markers: milestoneMarks, tipFmt: v => v.toFixed(2) + " m" }),
        card("Waypoints in training",
            "Waypoints per episode during training. Consistently optimistic against the held-out exam above — it is a best-of-512 on missions the fleet has seen.",
            [{ name: "fleet average", color: S.s2, pts: s.map(r => [r.gen, r.wp]).filter(p => p[1] != null) },
             { name: "best", color: S.s1, pts: s.map(r => [r.gen, r.bestWp]).filter(p => p[1] != null) }],
            { y0: 0, markers: milestoneMarks, tipFmt: v => v.toFixed(2) })
    ];

    /* The activation A/B, shown only while there is more than one lineage to
     * compare — after the cull it is one line and says nothing. Colour follows
     * the ACTIVATION, not its rank, so a deme that overtakes another does not
     * swap colours underneath the reader. */
    /* Interbreeding run: the activation is a proportion, not a label. 50% is
     * where the founding pool started, so the reference line is what makes the
     * chart readable — the question is which side of it selection drifts to. */
    const leakyPts = s.map(r => [r.gen, r.leaky]).filter(p => p[1] != null);
    if (leakyPts.length) {
        cards.splice(1, 0, card("Leaky share of hidden units",
            "ReLU and leaky ReLU are the same function either side of zero, so they interbreed and crossover carries each neuron's slope — a brain is a mixture of hard and leaky units. This is the share that leaks. The pool started at 50%. " +
            "Read a drift as a hint and not a result: a GA sweeps whole genomes, so a slope's share can rise by hitchhiking on an unrelated good mutation.",
            [{ name: "whole pool", color: S.s2, pts: leakyPts },
             { name: "best individual", color: S.s1, pts: s.map(r => [r.gen, r.bestLeaky]).filter(p => p[1] != null) }],
            { y0: 0, y1: 100, markers: milestoneMarks, yFmt: v => v.toFixed(0) + "%", tipFmt: v => v.toFixed(0) + "%", height: 210 }));
    }

    if (demeActs.length > 1) {
        cards.splice(1, 0, card(wentMixed ? "Hidden activation — the isolated phase"
                                          : "Hidden activation — three lineages, one exam",
            "tanh, leaky ReLU and ReLU evolve as separate populations that never interbreed, scored on the identical missions every generation, so the mission draw cancels out of the comparison. " +
            (wentMixed ? "This phase has ended — tanh was dropped and the two rectifiers were merged into one interbreeding pool, which is the chart beside this one."
             : cullEvent ? "The dashed line is the cull: the winner took the whole population and the run is single-activation from there."
                         : "At the cull generation the whole population goes to whichever is ahead."),
            demeActs.map(a => ({ name: a, color: ACT_COLOR[a] || S.s2,
                pts: s.filter(r => r.demes).map(r => {
                    const d = r.demes.find(x => x.act === a);
                    return d ? [r.gen, d.best] : null;
                }).filter(Boolean) })),
            { markers: cullEvent ? [{ x: cullEvent.gen, color: "var(--good)" }] : [], height: 210 }));
    }
    /* Rebuild the card DOM only when the SET of cards changes — a deme chart
     * appearing, a plateau round starting. Otherwise keep the existing nodes so
     * lineChart can animate from what is on screen, and so a table someone has
     * opened stays open. */
    const key = cards.map(c => c.id).join(",");
    const host = $("charts");
    if (host.dataset.key !== key) {
        host.dataset.key = key;
        host.innerHTML = cards.map(c => c.html).join("");
        document.querySelectorAll("button.tbl").forEach(btn => btn.onclick = () => {
            const t = $(btn.dataset.for);
            t.classList.toggle("hide");
            // Built on demand from the series held on the node, so opening a table
            // always shows the current numbers even though it was not being kept
            // up to date while hidden.
            if (!t.classList.contains("hide")) t.innerHTML = tableFor(t._defs || [], "gen");
            btn.textContent = t.classList.contains("hide") ? "table" : "chart";
        });
    }
    for (const c of cards) {
        lineChart($(c.id), Object.assign({ series: c.seriesDefs, aria: "" }, c.opts || {}));
        const t = $(c.tid);
        t._defs = c.seriesDefs;
        // Only re-render a table that is actually open; rebuilding a hidden
        // 200-row table twelve times a minute is pure work for nobody.
        if (!t.classList.contains("hide")) t.innerHTML = tableFor(c.seriesDefs, "gen");
    }

    // Milestones are events too, and the most consequential ones — merged in by
    // generation so the list reads in run order rather than by source.
    const eventList = d.events.concat((d.milestones || []).map(m =>
        ({ gen: m.gen, kind: "milestone", text: m.text || m.label || m.kind })))
        .sort((a, b) => a.gen - b.gen);
    $("events").innerHTML = eventList.map(e =>
        `<li><span class="tag ${e.kind}">${e.kind}</span><span>gen ${e.gen} — ${e.text.replace(/</g, "&lt;")}</span></li>`).join("")
        || `<li><span>nothing yet</span></li>`;
}

/* Five seconds. A generation takes 6-12 s, so this lands a new point within a
 * few seconds of it existing without the poll itself becoming the load. Charts
 * skip their animation entirely when nothing changed (see lineChart), so the
 * common case — a poll between generations — costs one small fetch and touches
 * no geometry.
 *
 * Backs off when the tab is hidden: a dashboard left open overnight on a laptop
 * should not keep waking it up to redraw something nobody is looking at. */
const POLL_MS = 5000, POLL_HIDDEN_MS = 60000;
let pollTimer = 0, polling = false;

async function tick() {
    if (polling) return;                 // a slow response must not stack requests
    polling = true;
    try {
        const r = await fetch("/api", { cache: "no-store" });
        DATA = await r.json();
        render(DATA);
    } catch (e) {
        $("hdr-updated").textContent = "cannot reach the server";
    } finally {
        polling = false;
    }
}
function schedule() {
    clearInterval(pollTimer);
    pollTimer = setInterval(tick, document.hidden ? POLL_HIDDEN_MS : POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); schedule(); });
tick();
schedule();
</script>
</body>
</html>
