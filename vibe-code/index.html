<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Code - Projects Gallery</title>
    <meta name="description" content="A gallery of interactive experiments by Mikkel Lorenz — physics simulations, games, and browser tools, all vibe-coded for fun.">
    <link rel="canonical" href="https://mlorenz.xyz/vibe-code/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mlorenz.xyz/vibe-code/">
    <meta property="og:title" content="Vibe Code — Projects Gallery">
    <meta property="og:description" content="Physics simulations, games, and browser tools, all vibe-coded for fun.">
    <meta property="og:image" content="https://mlorenz.xyz/vibe-code/simulations/cosmo_lab/thumbnail.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar" aria-label="Main">
        <div class="container">
            <a class="logo" href="../index.html">Mikkel Lorenz</a>
            <div class="nav-items">
                <a href="../blog/index.html">Blog</a>
                <a href="index.html" aria-current="page">Vibe Code</a>
                <a href="../consultancy/index.html">Consultancy</a>
            </div>
        </div>
    </nav>

    <main class="vc-gallery" id="main-content">
        <header class="vc-head container">
            <h1 class="vc-title">Vibe Code</h1>
            <p class="vc-lede">Interactive experiments in physics, machine learning and browser tools.</p>
        </header>

        <!-- Full-width sticky bar; the sentinel tells JS when it has stuck -->
        <div class="vc-sentinel" aria-hidden="true"></div>
        <div class="vc-bar search-container">
            <div class="container vc-toolbar" role="search">
                <div class="vc-search">
                    <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" id="search-input" placeholder="Search projects" class="search-input" aria-label="Search projects" autocomplete="off" spellcheck="false" enterkeyhint="search">
                    <kbd class="vc-kbd" aria-hidden="true">/</kbd>
                    <button type="button" id="search-clear" class="vc-search-clear" aria-label="Clear search">
                        <i class="fas fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="vc-pills" id="category-pills" role="tablist" aria-label="Filter by category">
                    <!-- Category pills injected by JS -->
                </div>
                <div class="vc-sort">
                    <i class="fas fa-arrow-down-wide-short" aria-hidden="true"></i>
                    <select id="sort-options" class="filter-select" aria-label="Sort projects">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">A – Z</option>
                        <option value="za">Z – A</option>
                    </select>
                </div>
                <div class="vc-view" role="group" aria-label="Layout">
                    <button type="button" data-view="grid" aria-label="Grid" aria-pressed="true">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg>
                    </button>
                    <button type="button" data-view="list" aria-label="List" aria-pressed="false">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="4" height="3" rx="1"/><rect x="1.5" y="6.5" width="4" height="3" rx="1"/><rect x="1.5" y="11" width="4" height="3" rx="1"/><path d="M8 3.5h6.5M8 8h6.5M8 12.5h6.5"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="vc-subbar container">
            <div class="vc-topics" id="topic-chips" role="group" aria-label="Topics">
                <!-- Topic chips injected by JS -->
            </div>
            <p class="vc-count" id="result-count" aria-live="polite"></p>
        </div>

        <div class="projects-container" id="projects-container">
            <!-- Projects will be loaded here by JS -->
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2026 Mikkel Lorenz</p>
            <ul class="footer-links">
                <li><a href="mailto:mikkelvind@gmail.com">Email</a></li>
                <li><a href="https://github.com/MIKKELLORENZ" target="_blank" rel="noopener">GitHub</a></li>
                <li><a href="https://www.linkedin.com/in/mikkel-lorenz-67b0a636/" target="_blank" rel="noopener">LinkedIn</a></li>
                <li><a href="../blog/feed.xml">RSS</a></li>
            </ul>
        </div>
    </footer>

    <script src="../js/projects.js" defer></script>
</body>
</html>
