<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Code - Projects Gallery</title>
    <meta name="description" content="A gallery of interactive experiments by Mikkel Lorenz — physics simulations, games, and browser tools, all vibe-coded for fun.">
    <link rel="canonical" href="https://mlorenz.xyz/vibe-code/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mlorenz.xyz/vibe-code/">
    <meta property="og:title" content="Vibe Code — Projects Gallery">
    <meta property="og:description" content="Physics simulations, games, and browser tools, all vibe-coded for fun.">
    <meta property="og:image" content="https://mlorenz.xyz/vibe-code/simulations/cosmo_lab/thumbnail.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar" aria-label="Main">
        <div class="container">
            <a class="logo" href="../index.html">Mikkel Lorenz</a>
            <div class="nav-items">
                <a href="../blog/index.html">Blog</a>
                <a href="index.html" aria-current="page">Vibe Code</a>
                <a href="../consultancy/index.html">Consultancy</a>
            </div>
        </div>
    </nav>

    <main class="container vc-gallery" id="main-content">
        <h1 class="sr-only">Vibe Code — Projects Gallery</h1>

        <!-- Featured showcase carousel, built by JS from the newest projects -->
        <section id="showcase" aria-label="Featured projects"></section>

        <div class="search-container vc-toolbar" role="search">
            <div class="vc-search">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" id="search-input" placeholder="Search projects, tags, ideas…" class="search-input" aria-label="Search projects" autocomplete="off">
                <button type="button" id="search-clear" class="vc-search-clear" aria-label="Clear search">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="vc-pills" id="category-pills" role="tablist" aria-label="Filter by category">
                <!-- Category pills injected by JS -->
            </div>
            <select id="sort-options" class="filter-select" aria-label="Sort projects">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="az">A – Z</option>
                <option value="za">Z – A</option>
            </select>
        </div>

        <div class="projects-container" id="projects-container">
            <!-- Projects will be loaded here by JS -->
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2026 Mikkel Lorenz</p>
            <ul class="footer-links">
                <li><a href="mailto:mikkelvind@gmail.com">Email</a></li>
                <li><a href="https://github.com/MIKKELLORENZ" target="_blank" rel="noopener">GitHub</a></li>
                <li><a href="https://www.linkedin.com/in/mikkel-lorenz-67b0a636/" target="_blank" rel="noopener">LinkedIn</a></li>
                <li><a href="../blog/feed.xml">RSS</a></li>
            </ul>
        </div>
    </footer>

    <script src="../js/projects.js" defer></script>
</body>
</html>
